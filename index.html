<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>I Conti di Baozzi</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main id="scena">

        <!-- Libreria -->

        <img
            src="libreria.png.PNG"
            alt="Libreria Baozzi"
            id="libreria">


        <!-- Libro che esce -->

        <img
            src="libro-baozzi.png"
            alt="Libro Baozzi"
            id="libro">


        <!-- Prima pagina del libro -->

        <img
            src="dedica.png"
            alt="Dedica"
            id="dedica">


        <!-- Zona cliccabile del libro -->

        <button
            id="apri-libro"
            type="button"
            aria-label="Apri I Conti di Baozzi">
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
